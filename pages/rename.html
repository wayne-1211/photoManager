<div class="page-head">
  <h1 class="page-title">批次改名</h1>
</div>

<div class="toolbar rn-bar">
  <div class="control-group rn-pattern">
    <label for="rnPattern">命名</label>
    <input type="text" id="rnPattern" class="rn-input" spellcheck="false"
      value="{date}_{camera}_{index}">
  </div>
  <div class="control-group">
    <label for="rnStart">起號</label>
    <input type="number" id="rnStart" class="rn-input rn-num" min="0" value="1">
  </div>
  <div class="control-group">
    <label for="rnPad">位數</label>
    <input type="number" id="rnPad" class="rn-input rn-num" min="1" max="8" value="3">
  </div>
  <div class="control-group">
    <label for="rnCase">副檔名</label>
    <select id="rnCase" class="mini-select">
      <option value="keep">原樣</option>
      <option value="lower" selected>小寫</option>
      <option value="upper">大寫</option>
    </select>
  </div>
  <label class="check">
    <input type="checkbox" id="rnMarkedOnly"> 只改已標記
  </label>
</div>

<div class="rn-tokens" id="rnTokens"></div>

<details class="rn-regex" id="rnRegexBox">
  <summary>正則取代</summary>
  <div class="rn-regex-row">
    <input type="text" id="rnFind" class="rn-input" spellcheck="false" placeholder="/DSC_(\d+)/i">
    <input type="text" id="rnReplace" class="rn-input" spellcheck="false" placeholder="IMG_$1">
    <span class="rn-regex-note" id="rnRegexNote"></span>
  </div>
</details>

<div class="rn-actions">
  <button class="export-btn" id="rnApplyBtn" disabled>套用改名</button>
  <span class="rn-summary" id="rnSummary">—</span>
  <div class="apply-result" id="rnResult" hidden></div>
</div>

<div class="rn-preview" id="rnPreview"></div>
<div id="rnPagination" class="pagination"></div>
<div id="rnEmpty" class="empty-state">
  <div class="glyph">◎</div>
  <p>尚未載入照片</p>
</div>
